                  summary: page 가 10000 을 넘음
                  value:
                    code: VALIDATION_FAILED
                    message: "입력한 내용을 확인해 주세요."
                    details:
                      - field: page
                        rule: maximum
                    trace_id: "4f1c2a9e0b7d4e6f8a3b5c7d9e1f2a3b"
                pageNotInteger:
                  summary: page 가 정수가 아님(예 "abc", "1.5")
                  value:
                    code: VALIDATION_FAILED
                    message: "입력한 내용을 확인해 주세요."
                    details:
                      - field: page
                        rule: type
                    trace_id: "4f1c2a9e0b7d4e6f8a3b5c7d9e1f2a3b"
                pageZero:
                  summary: page 가 0
                  value:
                    code: VALIDATION_FAILED
                    message: "입력한 내용을 확인해 주세요."
                    details:
                      - field: page
                        rule: minimum
                    trace_id: "4f1c2a9e0b7d4e6f8a3b5c7d9e1f2a3b"
                tooLongQuery:
                  summary: q 가 1000자를 넘음
                  value:
                    code: VALIDATION_FAILED
                    message: "입력한 내용을 확인해 주세요."
                    details:
                      - field: q
                        rule: maxLength
                    trace_id: "4f1c2a9e0b7d4e6f8a3b5c7d9e1f2a3b"
                unknownQuery:
                  summary: 알 수 없는 쿼리 매개변수(보낸 키 이름은 담지 않는다)
                  value:
                    code: VALIDATION_FAILED
                    message: "입력한 내용을 확인해 주세요."
                    details:
                      - field: "(query)"
                        rule: additionalProperties
                    trace_id: "4f1c2a9e0b7d4e6f8a3b5c7d9e1f2a3b"
        "401":
          $ref: "#/components/responses/SessionExpired"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          description: >-
            UNAVAILABLE. 원인은 저장소 오류·시간 초과이다. 화면은 결과 목록 자리에 안내와 「다시 검색」을 보인다.
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControlNoStore"
            X-Request-Id:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                unavailable:
                  value:
                    code: UNAVAILABLE
                    message: "검색하지 못했습니다. 다시 검색해 주세요. 계속되면 IT 지원(내선 <IT 지원 내선>)에 문의하세요"
                    details: []
                    trace_id: "4f1c2a9e0b7d4e6f8a3b5c7d9e1f2a3b"

  /api/books/{bookId}:
    get:
      operationId: getBook
      tags: [도서]
      summary: 도서 상세와 권별 상태를 가져온다
      description: >-
        도서 상세 화면(SCR-03)이 열릴 때와 「다시 불러오기」를 누를 때 부른다. 세션이 필요하다. CSRF 토큰은 필요 없다.
        도서 정보, 권별 대여 가능 여부(copyNo 오름차순), 그리고 요청한 임직원 본인에게 연체 중인 대여 건이 있는지(hasOverdue)를 함께 돌려준다.
        hasOverdue 는 「대여」 버튼을 화면을 연 시점부터 비활성으로 보일지 정하는 데 쓴다. 다만 대여 때 서버가 다시 확인하므로 최종 판정은 borrowBook 이 한다.
        bookId 가 형식에 맞지 않거나 9223372036854775807 을 넘어도, 없는 도서와 같이 404 BOOK_NOT_FOUND 이다(400 이 아님). 세션 확인이 먼저다.
      x-screens: [SCR-03, SCR-06]
      parameters:
        - $ref: "#/components/parameters/BookId"
      responses:
        "200":
          description: 도서 상세
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControlNoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BookDetail"
              examples:
                default:
                  value:
                    bookId: "101"
                    title: "시험 도서 A"
                    author: "저자 A"
                    hasCover: true
                    availableCount: 1
                    publisher: "시험 출판사"
                    description: "시험용 소개 글이다."
                    copies:
                      - copyNo: 1
                        available: true
                      - copyNo: 2
                        available: false
                    hasOverdue: false
                noPublisher:
                  summary: 출판사·소개가 없는 도서
                  value:
                    bookId: "102"
                    title: "시험 도서 B"
                    author: "저자 B"
                    hasCover: false
                    availableCount: 0
                    publisher: null
                    description: null
                    copies:
                      - copyNo: 1
                        available: false
                    hasOverdue: true
                singleCopy:
