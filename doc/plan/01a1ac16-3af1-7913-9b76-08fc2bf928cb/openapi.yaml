                    trace_id: "4f1c2a9e0b7d4e6f8a3b5c7d9e1f2a3b"
                tooLongPassword:
                  summary: 비밀번호가 1024자를 넘음
                  value:
                    code: VALIDATION_FAILED
                    message: "입력한 내용을 확인해 주세요."
                    details:
                      - field: password
                        rule: maxLength
                    trace_id: "4f1c2a9e0b7d4e6f8a3b5c7d9e1f2a3b"
                unparsableBody:
                  summary: 본문이 JSON 으로 읽히지 않음
                  value:
                    code: VALIDATION_FAILED
                    message: "입력한 내용을 확인해 주세요."
                    details:
                      - field: "(body)"
                        rule: type
                    trace_id: "4f1c2a9e0b7d4e6f8a3b5c7d9e1f2a3b"
                bodyTooLarge:
                  summary: 본문 한도 초과(nginx 413 을 400 으로 바꿈)
                  value:
                    code: VALIDATION_FAILED
                    message: "입력한 내용을 확인해 주세요."
                    details:
                      - field: "(body)"
                        rule: maxLength
                    trace_id: "4f1c2a9e0b7d4e6f8a3b5c7d9e1f2a3b"
        "401":
          description: >-
            AUTH_FAILED. 원인은 회사 계정 시스템이 계정 또는 비밀번호를 거절한 것이다. 어느 쪽이 틀렸는지는 알리지 않는다.
            사용자는 비밀번호를 비운 채 다시 입력하고, 계속되면 IT 지원에 문의한다.
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControlNoStore"
            X-Request-Id:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                authFailed:
                  value:
                    code: AUTH_FAILED
                    message: "계정 또는 비밀번호가 맞지 않습니다. 다시 입력해 주세요. 계속되면 IT 지원(내선 <IT 지원 내선>)에 문의하세요"
                    details: []
                    trace_id: "4f1c2a9e0b7d4e6f8a3b5c7d9e1f2a3b"
        "403":
          $ref: "#/components/responses/CsrfRejected"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          description: >-
            UNAVAILABLE. 원인은 서비스 저장소 오류·시간 초과, 또는 회사 계정 동시 확인 호출이 상한(10건)에 닿아 기다리지 않고 거절한 것이다.
            이미 로그인한 사용자에게는 영향이 없다. 사용자는 잠시 뒤 다시 시도하고 계속되면 IT 지원에 문의한다.
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControlNoStore"
            X-Request-Id:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                unavailable:
                  value:
                    code: UNAVAILABLE
                    message: "처리하지 못했습니다. 다시 시도해 주세요. 계속되면 IT 지원(내선 <IT 지원 내선>)에 문의하세요"
                    details: []
                    trace_id: "4f1c2a9e0b7d4e6f8a3b5c7d9e1f2a3b"
        "504":
          description: >-
            AUTH_UNAVAILABLE. 원인은 회사 계정 시스템이 10초 안에 답하지 않음·연결 실패·응답 형식 이상, 또는 회사 메일을 받지 못해 로그인을 허용할 수 없는 것이다.
            사용자는 잠시 뒤 다시 시도하고 계속되면 IT 지원에 문의한다.
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControlNoStore"
            X-Request-Id:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                authUnavailable:
                  value:
                    code: AUTH_UNAVAILABLE
                    message: "회사 계정 확인을 하지 못했습니다. 다시 시도해 주세요. 계속되면 IT 지원(내선 <IT 지원 내선>)에 문의하세요"
                    details: []
                    trace_id: "4f1c2a9e0b7d4e6f8a3b5c7d9e1f2a3b"
    get:
      operationId: getSession
      tags: [설정과 세션]
      summary: 지금 로그인한 임직원의 id 를 확인한다
      description: >-
        로그인 이후 모든 화면이 열릴 때 부른다. 화면은 돌려받은 employeeId 로 「내 대여 현황」 주소를 만든다.
        세션 쿠키가 필요하다. 쿠키가 없거나 서버에서 만료·삭제된 세션이면 401 SESSION_EXPIRED 이고 화면은 로그인 화면으로 보낸다.
        CSRF 토큰은 필요 없다(변경 요청이 아님).
      x-screens: [SCR-02, SCR-03, SCR-04, SCR-05, SCR-06, SCR-08]
      responses:
        "200":
          description: 로그인된 임직원
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControlNoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionInfo"
              examples:
                default:
                  value:
                    employeeId: "0b6f1c2e-5d3a-4e8b-9a47-2c1d8e7f6a50"
        "401":
          $ref: "#/components/responses/SessionExpired"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          description: >-
            UNAVAILABLE. 원인은 세션을 확인할 저장소 오류·시간 초과이다. 사용자는 다시 시도하고 계속되면 IT 지원에 문의한다.
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControlNoStore"
            X-Request-Id:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                unavailable:
                  value:
                    code: UNAVAILABLE
                    message: "처리하지 못했습니다. 다시 시도해 주세요. 계속되면 IT 지원(내선 <IT 지원 내선>)에 문의하세요"
                    details: []
                    trace_id: "4f1c2a9e0b7d4e6f8a3b5c7d9e1f2a3b"
    delete:
      operationId: logout
      tags: [설정과 세션]
      summary: 로그아웃한다
      description: >-
        상단 바의 「로그아웃」을 누를 때 부른다. 세션 쿠키와 X-CSRF-Token 머리말이 모두 필요하다.
        서버가 세션 행을 지우고 세션 쿠키를 만료시킨다. 성공하면 화면은 로그인 화면으로 간다.
      x-screens: [SCR-02, SCR-03, SCR-04, SCR-06, SCR-08]
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      responses:
        "200":
          description: 로그아웃됨. 본문은 비어 있고 세션 쿠키가 지워진다.
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControlNoStore"
            Set-Cookie:
              description: "__Host-session=; Max-Age=0; HttpOnly; Secure; SameSite=Strict; Path=/ (쿠키 삭제)"
              schema:
                type: string
        "401":
          $ref: "#/components/responses/SessionExpired"
        "403":
          $ref: "#/components/responses/CsrfRejected"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          description: >-
            UNAVAILABLE. 원인은 세션을 지울 저장소 오류·시간 초과이다. 로그아웃이 끝났는지 알 수 없으므로 사용자는 다시 시도한다.
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControlNoStore"
            X-Request-Id:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                unavailable:
                  value:
                    code: UNAVAILABLE
                    message: "처리하지 못했습니다. 다시 시도해 주세요. 계속되면 IT 지원(내선 <IT 지원 내선>)에 문의하세요"
                    details: []
                    trace_id: "4f1c2a9e0b7d4e6f8a3b5c7d9e1f2a3b"

  /api/books:
    get:
      operationId: searchBooks
      tags: [도서]
      summary: 제목·저자로 도서를 검색한다
      description: >-
        도서 검색 화면(SCR-02)이 열릴 때와 「검색」「다음」을 누를 때 부른다. 세션이 필요하다. CSRF 토큰은 필요 없다.
        q 는 제목 또는 저자에 들어 있는 글자이다. 화면은 보내기 전에 공유 정규화 함수(앞뒤 공백 무시·공백 모두 제거·소문자·x-search-truncate 글자에서 자르기)를 적용한다.
        서버가 q 를 받으면 같은 정규화를 한 번 더 적용하므로, q 의 명세 상한은 1000자이고 그것을 넘을 때만 400 이다.
        q 가 비어 있거나 없으면 전체 도서이다.
        정렬은 제목 오름차순(문자 코드 순)이고 같으면 도서 id 순이다. 한 쪽은 x-page-size(20)건이고 다음 쪽이 있으면 hasNext 가 true 이다.
        결과 범위를 넘는 page 는 빈 items 와 hasNext false 로 답한다. 알 수 없는 쿼리 매개변수는 거부한다.
        availableCount 는 저장하지 않고 열린 대여 건이 없는 권 수를 읽을 때 계산한 값이다.
      x-screens: [SCR-02]
      parameters:
        - $ref: "#/components/parameters/QueryQ"
        - $ref: "#/components/parameters/QueryPage"
      responses:
        "200":
          description: 검색 결과 한 쪽
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControlNoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BookSearchPage"
              examples:
                default:
                  summary: 시험 도서 둘
                  value:
                    items:
                      - bookId: "101"
                        title: "시험 도서 A"
                        author: "저자 A"
                        hasCover: true
                        availableCount: 1
                      - bookId: "102"
                        title: "시험 도서 B"
                        author: "저자 B"
                        hasCover: false
                        availableCount: 0
                    hasNext: false
                empty:
                  summary: 결과 없음
                  value:
                    items: []
                    hasNext: false
                lastPageEmpty:
                  summary: 범위를 넘는 쪽(page=10000)은 오류가 아니라 빈 items
                  value:
                    items: []
                    hasNext: false
                maxTitle:
                  summary: 제목이 최대 길이(300자)인 도서(자리표시자 제목)
                  value:
                    items:
                      - bookId: "103"
                        title: "시험제목시험제목시험제목시험제목시험제목시험제목시험제목시험제목시험제목시험제목시험제목시험제목시험제목시험제목시험제목시험제목시험제목시험제목시험제목시험제목시험제목시험제목시험제목시험제목시험제목시험제목시험제목시험제목시험제목시험제목시험제목시험제목시험제목시험제목시험제목시험제목시험제목시험제목시험제목시험제목시험제목시험제목시험제목시험제목시험제목시험제목시험제목시험제목시험제목시험제목시험제목시험제목시험제목시험제목시험제목시험제목시험제목시험제목시험제목시험제목시험제목시험제목시험제목시험제목시험제목시험제목시험제목시험제목시험제목시험제목시험제목시험제목시험제목시험제목시험제목"
                        author: "저자 C"
                        hasCover: false
                        availableCount: 1
                    hasNext: false
        "400":
          description: >-
            VALIDATION_FAILED. 원인은 q 가 1000자를 넘음(maxLength), page 가 1~10000 범위를 벗어남(minimum·maximum), page 가 정수가 아님(type),
            알 수 없는 쿼리 매개변수(additionalProperties, field 는 고정 표지 (query))이다.
            사용자는 검색어를 줄이거나 고쳐 다시 검색한다.
          headers:
