openapi: 3.0.3
info:
  title: 사내 도서 대여 서비스 API
  version: 1.0.0
  description: >-
    사내 도서 대여 서비스 1차 오픈의 HTTP 인터페이스 명세다.
    임직원은 회사 계정으로 로그인한 뒤 도서를 검색하고, 상세를 보고, 빌리고, 내 대여 현황을 보고, 반납한다.
    로그인하면 서버가 8시간짜리 세션 쿠키(__Host-session)를 주고, 변경 요청(로그인·로그아웃·대여·반납)은
    X-CSRF-Token 머리말을 함께 보내야 한다. 처리 순서는 명세 검증 → 세션 확인 → CSRF 확인이다(tech-spec 11.6).
    남의 대여 현황이나 남의 대여 건에 접근하면 있든 없든 똑같이 403 FORBIDDEN 으로 답해 존재 여부를 알리지 않는다.
    이 파일이 입력 검증 규칙, 오류 코드, 오류 문구의 정본이며, 서버 검증과 화면 검증이 모두 여기서 만들어진다.
    개인정보(이름·부서·회사 메일)는 어떤 응답에도 담지 않는다.
    /api 아래 없는 경로·틀린 메서드는 405 나 Allow 머리말 없이 11.1 형식의 404 ROUTE_NOT_FOUND 로 답한다.
    예시 기준일(FixedClock 오늘)은 2028-03-02 이다. 대여·현황·반납 예시의 날짜는 모두 이 날을 기준으로 맞췄고,
    같은 loanId 는 예시마다 같은 날짜를 가진다. 대여 예시(L1)와 현황·반납 예시(L2·L3)는 서로 다른 임직원의 장면이다.
servers:
  - url: /
    description: 서비스 앞의 사내 프록시가 HTTPS 를 끝내고 같은 출처로 전달한다. 모든 /api 응답은 Cache-Control no-store 이다(표지 이미지만 예외).
tags:
  - name: 설정과 세션
    description: 로그인 전 공개 정보, CSRF 토큰, 로그인·세션 확인·로그아웃
  - name: 도서
    description: 도서 검색, 상세, 표지
  - name: 대여와 반납
    description: 대여, 내 대여 현황, 반납
  - name: 운영
    description: 헬스 점검

# 아래 x- 확장은 모두 문서 최상위(info 가 아님)에 둔다. 서버와 화면 빌드가 최상위에서만 읽는다(tech-spec 11.4).
# x-page-size: 검색 결과 한 쪽의 건수. searchBooks 의 items 최대 건수와 같다.
x-page-size: 20
# x-search-truncate: 검색어를 정규화한 뒤 자르는 글자 수. q 의 명세 상한(maxLength 1000)과는 별개다.
x-search-truncate: 100
# x-error-messages: 오류 코드별 message 의 정본(tech-spec 11.3).
#   예시/정본 문구의 <IT 지원 내선> 은 서버가 IT_SUPPORT_EXT 값으로 치환한 뒤 응답한다. 시험 설정값은 자리표시자 02-0000-0001 이다.
#   UNAVAILABLE 은 연산마다 달라 x-unavailable-messages 에 있다. VALIDATION_FAILED 의 로그인 칸별 문구는 x-validation-messages 에 있다.
x-error-messages:
  OVERDUE_BLOCKED: "연체 중인 도서가 있어 새로 빌릴 수 없습니다. 내 대여 현황에서 연체 도서를 반납한 뒤 다시 빌려 주세요."
  NO_COPY_AVAILABLE: "방금 모든 권이 대여 중이 되었습니다. 도서 상세나 검색 화면으로 돌아가 다른 도서를 찾아 주세요."
  BOOK_NOT_FOUND: "도서를 찾을 수 없습니다"
  FORBIDDEN: "접근할 수 없습니다"
  ALREADY_RETURNED: "이미 반납된 도서입니다. 내 대여 현황을 다시 불러와 확인해 주세요."
  REQUEST_ID_CONFLICT: "대여가 되지 않았습니다. 내 대여 현황에서 확인한 뒤 필요하면 다시 빌려 주세요."
  UNAVAILABLE: "처리하지 못했습니다. 다시 시도해 주세요. 계속되면 IT 지원(내선 <IT 지원 내선>)에 문의하세요"
  AUTH_FAILED: "계정 또는 비밀번호가 맞지 않습니다. 다시 입력해 주세요. 계속되면 IT 지원(내선 <IT 지원 내선>)에 문의하세요"
  AUTH_UNAVAILABLE: "회사 계정 확인을 하지 못했습니다. 다시 시도해 주세요. 계속되면 IT 지원(내선 <IT 지원 내선>)에 문의하세요"
  VALIDATION_FAILED: "입력한 내용을 확인해 주세요."
  SESSION_EXPIRED: "로그인 유지 시간이 지났거나 로그인하지 않았습니다. 다시 로그인해 주세요."
  CSRF_REJECTED: "요청을 확인하지 못했습니다. 화면을 새로 고친 뒤 다시 시도해 주세요."
  ROUTE_NOT_FOUND: "요청한 주소를 찾을 수 없습니다."
# x-unavailable-messages: UNAVAILABLE(503, 예상 못한 오류는 500)의 operationId 별 message. 목록에 없는 연산은 default 를 쓴다.
x-unavailable-messages:
  searchBooks: "검색하지 못했습니다. 다시 검색해 주세요. 계속되면 IT 지원(내선 <IT 지원 내선>)에 문의하세요"
  getBook: "도서 정보를 불러오지 못했습니다. 다시 불러오거나 도서 검색으로 돌아가 주세요."
  listEmployeeLoans: "대여 현황을 불러오지 못했습니다. 다시 불러와 주세요."
  borrowBook: "대여가 되지 않았거나 결과를 확인하지 못했습니다. 내 대여 현황에서 확인한 뒤 필요하면 다시 빌려 주세요."
  returnLoan: "반납이 되지 않았거나 결과를 확인하지 못했습니다. 내 대여 현황을 다시 불러와 확인한 뒤 필요하면 다시 반납해 주세요."
  default: "처리하지 못했습니다. 다시 시도해 주세요. 계속되면 IT 지원(내선 <IT 지원 내선>)에 문의하세요"
# x-validation-messages: 화면이 details[].field/rule 로 칸 아래에 보이는 문구(로그인 두 칸).
#   required·minLength·pattern 은 모두 빈 칸으로 본다: 서버/Ajv 가 칸이 빈 경우에 내는 rule 이 누락=required, 빈 문자열=minLength,
#   공백만(account 만)=pattern 으로 갈리지만 사용자에게는 같은 칸 문구를 보인다. maxLength 는 칸별 길이 안내 문구이다.
#   타입 오류(예 account 에 숫자)는 rule type 으로 나오며 빈 칸 문구와 별개로 칸별 일반 입력 안내 「입력한 내용을 확인해 주세요」를 보인다.
#   (field, rule) 의 모든 조합에 문구가 있다. 이 밖의 rule(additionalProperties 등)은 칸 문구 없이 최상위 message 만 보인다.
x-validation-messages:
  login:
    account:
      required: "회사 계정을 입력해 주세요"
      minLength: "회사 계정을 입력해 주세요"
      pattern: "회사 계정을 입력해 주세요"
      maxLength: "회사 계정은 254자 이내로 입력해 주세요"
      type: "입력한 내용을 확인해 주세요"
    password:
      required: "비밀번호를 입력해 주세요"
      minLength: "비밀번호를 입력해 주세요"
      maxLength: "비밀번호는 1024자 이내로 입력해 주세요"
      type: "입력한 내용을 확인해 주세요"

security:
  - sessionCookie: []

paths:
  /api/public-config:
    get:
      operationId: getPublicConfig
      tags: [설정과 세션]
      summary: 로그인 화면에 보일 공개 설정을 가져온다
      description: >-
        로그인 화면(SCR-01)이 열릴 때 로그인 전에 부른다. 지금은 IT 지원 내선 하나만 돌려준다.
        세션도 CSRF 토큰도 필요 없다. 값은 환경변수 IT_SUPPORT_EXT 에서 온다.
      security: []
      x-screens: [SCR-01]
      responses:
        "200":
          description: 공개 설정
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControlNoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicConfig"
              examples:
                default:
                  summary: IT 지원 내선(자리표시자)
                  value:
                    itSupportExt: "<IT 지원 내선>"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          description: >-
            원인은 서비스 내부 오류이다. 로그인 화면은 IT 지원 안내 문구 자리에 값을 비워 둔 채 이어 쓸 수 있으며,
            사용자는 잠시 뒤 화면을 새로 고친다.
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControlNoStore"
            X-Request-Id:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                unavailable:
                  value:
                    code: UNAVAILABLE
                    message: "처리하지 못했습니다. 다시 시도해 주세요. 계속되면 IT 지원(내선 <IT 지원 내선>)에 문의하세요"
                    details: []
                    trace_id: "4f1c2a9e0b7d4e6f8a3b5c7d9e1f2a3b"

  /api/csrf:
    get:
      operationId: getCsrfToken
      tags: [설정과 세션]
      summary: CSRF 토큰을 받는다
      description: >-
        로그인 화면(SCR-01)이 열릴 때와 변경 요청이 CSRF_REJECTED 로 거절된 뒤 부른다.
        서버가 비밀 값을 __Host-csrf 쿠키(HttpOnly, Secure, SameSite=Strict)로 심고, 같은 비밀에서 만든 토큰을 응답으로 준다.
        화면은 이후 모든 변경 요청에 이 토큰을 X-CSRF-Token 머리말로 되돌려 보낸다(이중 제출).
        세션은 필요 없다. 로그인 성공 때 CSRF 비밀 값도 새로 발급되므로 로그인 직후에 다시 받는다.
      security: []
      x-screens: [SCR-01]
      responses:
        "200":
          description: CSRF 토큰. 응답 머리말에 __Host-csrf 쿠키가 심긴다.
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControlNoStore"
            Set-Cookie:
              description: "__Host-csrf=<비밀 값>; HttpOnly; Secure; SameSite=Strict; Path=/ (도메인 속성 없음)"
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CsrfTokenResponse"
              examples:
                default:
                  value:
                    csrfToken: "<CSRF_TOKEN>"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          description: >-
            원인은 서비스 내부 오류이다. 사용자는 화면을 새로 고쳐 다시 시도한다.
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControlNoStore"
            X-Request-Id:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                unavailable:
                  value:
                    code: UNAVAILABLE
                    message: "처리하지 못했습니다. 다시 시도해 주세요. 계속되면 IT 지원(내선 <IT 지원 내선>)에 문의하세요"
                    details: []
                    trace_id: "4f1c2a9e0b7d4e6f8a3b5c7d9e1f2a3b"

  /api/session:
    post:
      operationId: login
      tags: [설정과 세션]
      summary: 회사 계정으로 로그인한다
      description: >-
        로그인 화면(SCR-01)에서 「로그인」을 누를 때 부른다. 세션은 필요 없다(security 가 빈 목록).
        단, 로그인 CSRF 를 막기 위해 getCsrfToken 으로 받은 토큰을 X-CSRF-Token 머리말로 보내야 하고 Origin 도 허용된 출처여야 한다.
        서버가 회사 계정 시스템에 계정·비밀번호를 확인하고(최대 10초), 성공하면 새 세션 식별자를 __Host-session 쿠키
        (HttpOnly, Secure, SameSite=Strict, Path=/, 8시간 절대 만료)로 발급한다. 같은 요청에 이전 세션이 실려 있으면 지운다.
        성공 시 CSRF 비밀 값도 새로 발급하므로 화면은 getCsrfToken 을 다시 부른다.
        비밀번호는 저장하지도 로그에 남기지도 않으며 응답에도 되돌려 보내지 않는다.
        본문에 account, password 외의 필드가 있으면 거부한다.
        동시 확인 호출 상한(10건)이 차면 새 로그인이 503 UNAVAILABLE 이다. 출처별 속도 제한은 서비스에 두지 않는다(요구사항 A-19, tech-spec A-14).
        비밀번호는 공백도 글자이므로 공백만 있는 비밀번호는 유효하다(거절하지 않는다). 계정 칸만 공백만 있으면 거절한다.
        칸이 빈 경우 rule 은 누락=required, 빈 문자열=minLength, 공백만(account 만)=pattern 이고, 화면은 셋을 모두 빈 칸으로 보아 같은 문구를 보인다
        (x-validation-messages.login).
      security: []
      x-screens: [SCR-01]
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
            examples:
              default:
                summary: 회사 계정(메일 형식)과 비밀번호 자리표시자
                value:
                  account: "user1@example.com"
                  password: "<PASSWORD>"
      responses:
        "200":
          description: 로그인 성공. 세션 쿠키가 발급된다.
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControlNoStore"
            Set-Cookie:
              description: "__Host-session=<세션 값>; HttpOnly; Secure; SameSite=Strict; Path=/ (도메인 속성 없음, 값은 서버가 만든 무작위 값)"
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionInfo"
              examples:
                default:
                  value:
                    employeeId: "0b6f1c2e-5d3a-4e8b-9a47-2c1d8e7f6a50"
        "400":
          description: >-
            VALIDATION_FAILED. 원인은 account 또는 password 가 없음(required), 빈 문자열(minLength), account 가 공백만(pattern),
            길이 초과(maxLength: account 254자, password 1024자), 본문에 알 수 없는 필드가 있음, 본문이 JSON 이 아님, 본문 한도 초과이다.
            본문 한도 초과(프록시 nginx 의 413 은 400 VALIDATION_FAILED 로 바꿔 답한다)도 같은 400 이다.
            본문이 JSON 으로 읽히지 않으면 details 는 [{"field":"(body)","rule":"type"}], 본문 한도 초과면 [{"field":"(body)","rule":"maxLength"}] 이다.
            공백만 있는 password 는 오류가 아니다.
            details 의 field 와 rule 로 어느 칸이 왜 틀렸는지 알려 주며 보낸 값은 담지 않는다.
            사용자는 해당 칸 아래 문구를 보고 고쳐 다시 누른다.
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControlNoStore"
            X-Request-Id:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                emptyAccount:
                  summary: 회사 계정이 빈 문자열("")
                  value:
                    code: VALIDATION_FAILED
                    message: "입력한 내용을 확인해 주세요."
                    details:
                      - field: account
                        rule: minLength
                    trace_id: "4f1c2a9e0b7d4e6f8a3b5c7d9e1f2a3b"
                blankAccount:
                  summary: 회사 계정이 공백만("   ")
                  value:
                    code: VALIDATION_FAILED
                    message: "입력한 내용을 확인해 주세요."
                    details:
                      - field: account
                        rule: pattern
                    trace_id: "4f1c2a9e0b7d4e6f8a3b5c7d9e1f2a3b"
                missingAccount:
                  summary: 회사 계정 필드가 본문에 없음
                  value:
                    code: VALIDATION_FAILED
                    message: "입력한 내용을 확인해 주세요."
                    details:
                      - field: account
                        rule: required
                    trace_id: "4f1c2a9e0b7d4e6f8a3b5c7d9e1f2a3b"
                emptyPassword:
                  summary: 비밀번호가 빈 문자열("")
                  value:
                    code: VALIDATION_FAILED
                    message: "입력한 내용을 확인해 주세요."
                    details:
                      - field: password
                        rule: minLength
                    trace_id: "4f1c2a9e0b7d4e6f8a3b5c7d9e1f2a3b"
                missingPassword:
                  summary: 비밀번호 필드가 본문에 없음
                  value:
                    code: VALIDATION_FAILED
                    message: "입력한 내용을 확인해 주세요."
                    details:
