      operationId: returnLoan
      tags: [대여와 반납]
      summary: 빌린 도서 한 건을 반납한다
      description: >-
        반납 확인 대화상자(SCR-05)에서 「반납하기」를 확정할 때 부른다(SCR-04 에서 시작). 세션 쿠키와 X-CSRF-Token 머리말이 모두 필요하다. 요청 본문은 없다.
        소유권: 세션의 임직원이 빌린 건만 반납할 수 있다. 남의 건이든 없는 건이든 똑같이 403 FORBIDDEN 으로 답해 존재 여부를 알리지 않는다.
        loanId 가 UUID 형식이 아니어도 400 이 아니라 403 FORBIDDEN 이다. 세션 확인이 먼저다.
        연체 중이어도 반납할 수 있다. 내 건인데 이미 반납됐으면 409 ALREADY_RETURNED 이고 중복 처리하지 않는다.
        returnedOn 은 오늘(한국 표준시) 날짜이다.
      x-screens: [SCR-04, SCR-05, SCR-08]
      parameters:
        - $ref: "#/components/parameters/LoanId"
        - $ref: "#/components/parameters/CsrfToken"
      responses:
        "200":
          description: 반납됨
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControlNoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReturnResult"
              examples:
                default:
                  summary: 기준일 2028-03-02 에 연체 건 L2(예정일 2028-03-01)를 반납
                  value:
                    loanId: "a1b2c3d4-e5f6-4a7b-8c9d-0e1f2a3b4c5d"
                    returnedOn: "2028-03-02"
        "401":
          $ref: "#/components/responses/SessionExpired"
        "403":
          description: >-
            두 가지 중 하나이다. FORBIDDEN 은 남의 대여 건이거나 없는 대여 건이거나 loanId 형식이 틀린 것이고(존재를 알리지 않는다)
            사용자는 접근할 수 없음 화면에서 도서 검색으로 돌아간다.
            CSRF_REJECTED 는 X-CSRF-Token 머리말이 없거나 쿠키·Origin 과 맞지 않는 것이고(세션 확인 뒤에 검사한다) 사용자는 화면을 새로 고친 뒤 다시 시도한다.
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControlNoStore"
            X-Request-Id:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                forbidden:
                  value:
                    code: FORBIDDEN
                    message: "접근할 수 없습니다"
                    details: []
                    trace_id: "4f1c2a9e0b7d4e6f8a3b5c7d9e1f2a3b"
                csrfRejected:
                  value:
                    code: CSRF_REJECTED
                    message: "요청을 확인하지 못했습니다. 화면을 새로 고친 뒤 다시 시도해 주세요."
                    details: []
                    trace_id: "4f1c2a9e0b7d4e6f8a3b5c7d9e1f2a3b"
        "409":
          description: >-
            ALREADY_RETURNED. 원인은 내 건인데 이미 반납된 것이다. 사용자는 내 대여 현황을 다시 불러와 확인한다.
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControlNoStore"
            X-Request-Id:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                alreadyReturned:
                  value:
                    code: ALREADY_RETURNED
                    message: "이미 반납된 도서입니다. 내 대여 현황을 다시 불러와 확인해 주세요."
                    details: []
                    trace_id: "4f1c2a9e0b7d4e6f8a3b5c7d9e1f2a3b"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          description: >-
            UNAVAILABLE. 원인은 저장소 오류·시간 초과이다. 반납이 됐는지 모를 수 있으므로 사용자는 내 대여 현황을 다시 불러와 확인한 뒤 필요하면 다시 반납한다.
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControlNoStore"
            X-Request-Id:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                unavailable:
                  value:
                    code: UNAVAILABLE
                    message: "반납이 되지 않았거나 결과를 확인하지 못했습니다. 내 대여 현황을 다시 불러와 확인한 뒤 필요하면 다시 반납해 주세요."
                    details: []
                    trace_id: "4f1c2a9e0b7d4e6f8a3b5c7d9e1f2a3b"

  /healthz:
    get:
      operationId: getHealth
      tags: [운영]
      summary: 서비스가 살아 있고 DB 에 닿는지 점검한다
      description: >-
        운영 점검(프록시·감시 도구)이 주기적으로 부른다. 화면은 쓰지 않는다. 세션도 CSRF 도 필요 없다.
        프로세스와 SELECT 1 성공만 보며 인증 정보나 상세 정보는 돌려주지 않는다. /api 아래가 아니므로 200 에는 Cache-Control no-store 를 붙이지 않아도 되지만, 503 은 공통 오류 응답이라 no-store 가 붙는다(허용).
      security: []
      x-screens: []
      x-screens-reason: 운영 점검용이라 사용자 화면이 쓰지 않는다(tech-spec 3.3 의 화면 열 「없음(운영)」).
      responses:
        "200":
          description: 정상
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
              examples:
                default:
                  value:
                    status: ok
        "503":
          description: >-
            UNAVAILABLE. 원인은 DB 에 닿지 못함이다. 운영자가 서비스와 DB 상태를 확인한다.
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControlNoStore"
            X-Request-Id:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                unavailable:
                  value:
                    code: UNAVAILABLE
                    message: "처리하지 못했습니다. 다시 시도해 주세요. 계속되면 IT 지원(내선 <IT 지원 내선>)에 문의하세요"
                    details: []
                    trace_id: "4f1c2a9e0b7d4e6f8a3b5c7d9e1f2a3b"

components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: __Host-session
      description: >-
        로그인 성공 때 서버가 발급하는 세션 쿠키(HttpOnly, Secure, SameSite=Strict, Path=/, 도메인 속성 없음, 8시간 절대 만료·활동으로 늘리지 않음).
        비밀 값은 URL 에 두지 않는다. 쿠키가 없거나 서버에서 만료·삭제됐으면 401 SESSION_EXPIRED 이다.
  headers:
    CacheControlNoStore:
      description: >-
        /api 응답은 개인별 내용이 있어 저장하지 않게 no-store 를 붙인다(오류 응답 포함).
        예외는 getBookCover 의 200 하나뿐이다.
      schema:
        type: string
        enum: ["no-store"]
    XRequestId:
      description: 요청 id. 오류 본문의 trace_id 와 같다. 프록시가 준 값이 32자리 16진수일 때만 믿고 아니면 서버가 만든다.
      schema:
        type: string
        pattern: "^[0-9a-f]{32}$"
  parameters:
    CsrfToken:
      name: X-CSRF-Token
      in: header
      required: false
      description: >-
        getCsrfToken 이 준 토큰. 변경 요청(login, logout, borrowBook, returnLoan)마다 되돌려 보낸다.
        명세 검증에서는 필수가 아니다(required false). 머리말이 없는 경우도 명세 검증이 아니라 CSRF 확인 단계가 검사한다.
        처리 순서는 명세 검증 → 세션 확인 → CSRF 확인(tech-spec 11.6)이므로, 머리말이 없거나 __Host-csrf 쿠키·Origin 과 맞지 않으면
        세션 확인 뒤에 403 CSRF_REJECTED 이다(400 이 아니다).
        길이·형식도 명세 검증이 아니라 CSRF 확인 단계가 검사하므로 빈 값이나 긴 값도 세션 확인 뒤 403 CSRF_REJECTED 이다.
      schema:
        type: string
    BookId:
      name: bookId
      in: path
      required: true
      description: >-
        도서 id. 1 이상 9223372036854775807 이하의 양의 정수를 글자로 쓴 것이고 앞에 0 이 없다.
        형식이나 범위가 맞지 않으면 400 이 아니라 404 BOOK_NOT_FOUND 이다(존재하지 않는 id 와 구분하지 않는다).
      x-invalid-id-error: BOOK_NOT_FOUND
      x-max-value: "9223372036854775807"
      schema:
        $ref: "#/components/schemas/BookIdValue"
    EmployeeId:
      name: employeeId
      in: path
      required: true
      description: >-
        임직원 id(UUID). 세션의 임직원과 같아야 한다. 형식이 틀려도 400 이 아니라 403 FORBIDDEN 이다.
      x-invalid-id-error: FORBIDDEN
      schema:
        type: string
        format: uuid
        example: "0b6f1c2e-5d3a-4e8b-9a47-2c1d8e7f6a50"
    LoanId:
      name: loanId
      in: path
      required: true
      description: >-
        대여 건 id(UUID). 형식이 틀려도 400 이 아니라 403 FORBIDDEN 이다.
      x-invalid-id-error: FORBIDDEN
      schema:
        type: string
        format: uuid
        example: "3f2504e0-4f89-41d3-9a0c-0305e82c3301"
    QueryQ:
      name: q
      in: query
      required: false
      description: >-
        검색어. 제목 또는 저자에 들어 있는 글자이다. 없거나 비면 전체 도서. 명세 상한은 1000자이며,
        그 안의 값은 서버가 정규화(공백 모두 제거·소문자)하고 x-search-truncate(100)자에서 잘라 쓴다.
      schema:
        type: string
        maxLength: 1000
        default: ""
        example: "시험"
    QueryPage:
      name: page
      in: query
      required: false
      description: 쪽 번호. 1부터 시작하며 한 쪽은 x-page-size(20)건이다.
      schema:
        type: integer
        minimum: 1
        maximum: 10000
        default: 1
  responses:
    InternalError:
      description: >-
        UNAVAILABLE(상태 500). 원인은 예상하지 못한 서버 오류이다. 상세는 응답에 없고 로그에만 남는다.
        사용자는 잠시 뒤 다시 시도하고 계속되면 IT 지원에 문의하며, 화면은 실패한 영역 안 안내만 보인다.
      headers:
        Cache-Control:
          $ref: "#/components/headers/CacheControlNoStore"
        X-Request-Id:
          $ref: "#/components/headers/XRequestId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          examples:
            internal:
              value:
                code: UNAVAILABLE
                message: "처리하지 못했습니다. 다시 시도해 주세요. 계속되면 IT 지원(내선 <IT 지원 내선>)에 문의하세요"
                details: []
                trace_id: "4f1c2a9e0b7d4e6f8a3b5c7d9e1f2a3b"
    SessionExpired:
      description: >-
        SESSION_EXPIRED. 원인은 세션 쿠키가 없거나 서버에서 만료·삭제된 것이다(로그인 유지 시간 8시간 경과 포함).
        처리는 하지 않았다. 사용자는 로그인 화면으로 가서 다시 로그인한 뒤 직접 다시 누른다.
        서버는 열람 요청과 대여·반납 요청을 구분하지 않으며 화면이 어느 요청이 거절됐는지로 안내 문구를 고른다.
      headers:
        Cache-Control:
          $ref: "#/components/headers/CacheControlNoStore"
        X-Request-Id:
          $ref: "#/components/headers/XRequestId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          examples:
            expired:
              value:
                code: SESSION_EXPIRED
                message: "로그인 유지 시간이 지났거나 로그인하지 않았습니다. 다시 로그인해 주세요."
                details: []
                trace_id: "4f1c2a9e0b7d4e6f8a3b5c7d9e1f2a3b"
    Forbidden:
      description: >-
        FORBIDDEN. 원인은 남의 자원이거나 없는 자원이거나 경로 id 형식이 틀린 것이다(존재 여부를 알리지 않는다).
        화면은 접근할 수 없음 화면(SCR-08)을 보인다. 사용자는 도서 검색으로 돌아간다.
      headers:
        Cache-Control:
          $ref: "#/components/headers/CacheControlNoStore"
        X-Request-Id:
          $ref: "#/components/headers/XRequestId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          examples:
            forbidden:
              value:
                code: FORBIDDEN
                message: "접근할 수 없습니다"
                details: []
                trace_id: "4f1c2a9e0b7d4e6f8a3b5c7d9e1f2a3b"
    CsrfRejected:
      description: >-
        CSRF_REJECTED. 원인은 X-CSRF-Token 머리말이 없거나 __Host-csrf 쿠키와 맞지 않거나 Origin 이 허용된 출처와 다른 것이다.
        머리말은 명세 검증에서 필수가 아니므로 없는 경우도 400 이 아니라 이 403 이며, 세션 확인 뒤에 검사한다(tech-spec 11.6).
        처리는 하지 않았다. 사용자는 화면을 새로 고친 뒤 다시 시도한다(화면이 토큰을 새로 받고 자동 재시도는 하지 않는다).
      headers:
        Cache-Control:
          $ref: "#/components/headers/CacheControlNoStore"
        X-Request-Id:
          $ref: "#/components/headers/XRequestId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          examples:
            csrfRejected:
              value:
                code: CSRF_REJECTED
                message: "요청을 확인하지 못했습니다. 화면을 새로 고친 뒤 다시 시도해 주세요."
                details: []
                trace_id: "4f1c2a9e0b7d4e6f8a3b5c7d9e1f2a3b"
    BookNotFound:
      description: >-
        BOOK_NOT_FOUND. 원인은 도서가 없거나 bookId 형식·범위가 틀린 것이다. 화면은 찾을 수 없음 화면(SCR-06)을 같은 주소에서 보인다.
        사용자는 도서 검색으로 돌아간다.
      headers:
        Cache-Control:
          $ref: "#/components/headers/CacheControlNoStore"
        X-Request-Id:
          $ref: "#/components/headers/XRequestId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          examples:
            notFound:
              value:
                code: BOOK_NOT_FOUND
                message: "도서를 찾을 수 없습니다"
                details: []
                trace_id: "4f1c2a9e0b7d4e6f8a3b5c7d9e1f2a3b"
            overMaxId:
              summary: bookId 9223372036854775808(최대값 + 1)은 400 이 아니라 404
              value:
                code: BOOK_NOT_FOUND
                message: "도서를 찾을 수 없습니다"
                details: []
                trace_id: "4f1c2a9e0b7d4e6f8a3b5c7d9e1f2a3b"
    RouteNotFound:
      description: >-
        ROUTE_NOT_FOUND. 원인은 /api 아래에 없는 경로이거나 그 경로에 맞지 않는 메서드이다. 405 나 Allow 머리말 없이 항상 이 404 이다.
        어느 operation 에도 붙이지 않는 공통 응답이며 서버가 모든 /api 요청에 일반 규칙으로 적용한다.
      headers:
        Cache-Control:
          $ref: "#/components/headers/CacheControlNoStore"
        X-Request-Id:
          $ref: "#/components/headers/XRequestId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          examples:
            routeNotFound:
              value:
                code: ROUTE_NOT_FOUND
                message: "요청한 주소를 찾을 수 없습니다."
                details: []
                trace_id: "4f1c2a9e0b7d4e6f8a3b5c7d9e1f2a3b"
  schemas:
    BookIdValue:
      type: string
      description: >-
        도서 id 를 글자로 쓴 값. 경로 매개변수 bookId 와 응답의 bookId 가 모두 이 한 정의를 쓴다.
        1 이상 9223372036854775807 이하이고 앞에 0 이 없다. 최대값 9223372036854775807 은 getBook 200 이 될 수 있고
        9223372036854775808 부터는 404 BOOK_NOT_FOUND 이다.
      pattern: '^([1-9][0-9]{0,17}|[1-8][0-9]{18}|9[01][0-9]{17}|92[01][0-9]{16}|922[0-2][0-9]{15}|9223[0-2][0-9]{14}|92233[0-6][0-9]{13}|922337[01][0-9]{12}|92233720[0-2][0-9]{10}|922337203[0-5][0-9]{9}|9223372036[0-7][0-9]{8}|92233720368[0-4][0-9]{7}|922337203685[0-3][0-9]{6}|9223372036854[0-6][0-9]{5}|92233720368547[0-6][0-9]{4}|922337203685477[0-4][0-9]{3}|9223372036854775[0-7][0-9]{2}|922337203685477580[0-7])$'
      example: "101"
    ErrorResponse:
      type: object
      description: >-
        모든 /api 오류가 쓰는 하나의 모양이다. 코드가 정본이고 상태 코드는 일반 규칙이다.
        코드와 상태 — OVERDUE_BLOCKED·NO_COPY_AVAILABLE·ALREADY_RETURNED·REQUEST_ID_CONFLICT 는 409,
        BOOK_NOT_FOUND·ROUTE_NOT_FOUND 는 404, FORBIDDEN·CSRF_REJECTED 는 403, AUTH_FAILED·SESSION_EXPIRED 는 401,
        VALIDATION_FAILED 는 400, UNAVAILABLE 은 503(예상 못한 오류는 500), AUTH_UNAVAILABLE 은 504.
        message 의 정본은 문서 최상위 x-error-messages 와 x-unavailable-messages 이다.
        스택·SQL·서버 경로·토큰·다른 사람의 정보는 어떤 응답에도 담지 않는다.
      required: [code, message, details, trace_id]
      additionalProperties: false
      properties:
        code:
          type: string
          enum:
            - OVERDUE_BLOCKED
            - NO_COPY_AVAILABLE
            - BOOK_NOT_FOUND
            - FORBIDDEN
            - ALREADY_RETURNED
            - REQUEST_ID_CONFLICT
            - UNAVAILABLE
            - AUTH_FAILED
            - AUTH_UNAVAILABLE
            - VALIDATION_FAILED
            - SESSION_EXPIRED
            - CSRF_REJECTED
            - ROUTE_NOT_FOUND
        message:
          type: string
          description: >-
            사용자에게 보이는 문구(무엇이 잘못됐는지 + 다음에 할 일). 예시/정본 문구의 <IT 지원 내선> 은 서버가
            IT_SUPPORT_EXT 값으로 치환한 뒤 응답한다. 시험 설정값은 자리표시자 02-0000-0001 이다.
        details:
          type: array
          description: 항상 배열이다(없으면 빈 배열). 보낸 값은 담지 않는다.
          items:
            $ref: "#/components/schemas/ErrorDetail"
        trace_id:
          type: string
          pattern: "^[0-9a-f]{32}$"
          description: 요청 id(32자리 16진수). 응답 머리말 X-Request-Id 와 같다. 같은 값으로 로그를 찾는다.
    ErrorDetail:
      type: object
      required: [field, rule]
      additionalProperties: false
      properties:
        field:
          type: string
          maxLength: 100
          pattern: '^([A-Za-z][A-Za-z0-9]{0,63}|\(body\)|\(query\))$'
          description: >-
            어긴 칸의 이름. 명세에 있는 필드 이름(예 account, password, requestId, q, page)이거나,
            알 수 없는 키·본문 전체 문제일 때는 고정 표지 (body)(본문) 또는 (query)(쿼리)만 쓴다.
            호출자가 보낸 키 이름은 담지 않는다.
        rule:
          type: string
          enum: [required, minLength, maxLength, minimum, maximum, pattern, format, enum, additionalProperties, type]
          description: 어긴 규칙 이름. 위 목록으로 닫혀 있다. type 은 값의 자료형이 틀린 경우(예 account 에 숫자)이다.
    PublicConfig:
      type: object
      required: [itSupportExt]
      additionalProperties: false
      properties:
        itSupportExt:
          type: string
          description: IT 지원 내선(환경변수 IT_SUPPORT_EXT). 로그인 화면의 안내 문구에 들어간다.
    CsrfTokenResponse:
      type: object
      required: [csrfToken]
      additionalProperties: false
      properties:
        csrfToken:
          type: string
          minLength: 1
          description: 변경 요청의 X-CSRF-Token 머리말에 되돌려 보낼 토큰
    LoginRequest:
      type: object
      required: [account, password]
      additionalProperties: false
      properties:
        account:
          type: string
          minLength: 1
          maxLength: 254
          pattern: '\S'
          description: >-
            회사 계정(사번 또는 메일). 공백이 아닌 글자가 하나 이상 있어야 한다. 서버는 저장하지 않는다.
            누락=required, 빈 문자열=minLength, 공백만=pattern, 254자 초과=maxLength 를 낸다.
          example: "user1@example.com"
        password:
          type: string
          format: password
          writeOnly: true
          minLength: 1
          maxLength: 1024
          description: >-
            비밀번호. 저장·로그 금지이고 응답에 되돌려 보내지 않는다. 누락=required, 빈 문자열=minLength, 1024자 초과=maxLength 를 낸다.
            비밀번호는 공백도 글자이므로 공백만 있는 값은 유효하다(거절하지 않는다. pattern 제한 없음).
          example: "<PASSWORD>"
    SessionInfo:
      type: object
      required: [employeeId]
      additionalProperties: false
      properties:
        employeeId:
          type: string
          format: uuid
          description: 로그인한 임직원의 id(가명 id). 이름·부서·메일은 담지 않는다.
    BookListItem:
      type: object
      description: 목록 한 줄. BookDetail 이 allOf 로 이어받으므로 additionalProperties 를 막지 않는다(막으면 상세 필드가 거부된다).
      required: [bookId, title, author, hasCover, availableCount]
      properties:
        bookId:
          $ref: "#/components/schemas/BookIdValue"
        title:
          type: string
          maxLength: 300
          description: 제목(최대 300자, src/shared/limits.ts, tech-spec A-13)
        author:
          type: string
          maxLength: 200
          description: 저자(최대 200자)
        hasCover:
          type: boolean
          description: 표지가 있으면 true. false 면 화면은 getBookCover 를 부르지 않고 회색 자리 상자를 보인다.
        availableCount:
          type: integer
          minimum: 0
          description: >-
            열린 대여 건이 없는 권의 수. 저장하지 않고 읽을 때 계산한다.
            불변식: availableCount ≤ 도서의 권 수(상세의 copies 개수)이고, 0 이면 모두 대여 중이다.
    BookSearchPage:
      type: object
      required: [items, hasNext]
      additionalProperties: false
      properties:
        items:
          type: array
          maxItems: 20
          description: 한 쪽의 도서. 최대 x-page-size(20)건.
          items:
            $ref: "#/components/schemas/BookListItem"
        hasNext:
          type: boolean
          description: 다음 쪽이 있으면 true
    BookCopy:
      type: object
      required: [copyNo, available]
      additionalProperties: false
      properties:
        copyNo:
          type: integer
          minimum: 1
          description: 권 번호(도서 안의 순번)
        available:
          type: boolean
          description: 열린 대여 건이 없으면 true(대여 가능)
    BookDetail:
      description: 목록 항목의 모든 필드에 상세 필드와 hasOverdue 를 더한 모양이다.
      allOf:
        - $ref: "#/components/schemas/BookListItem"
        - type: object
          required: [publisher, description, copies, hasOverdue]
          properties:
            publisher:
              type: string
              maxLength: 200
              nullable: true
              description: 출판사(최대 200자). 없으면 null
            description:
              type: string
              maxLength: 5000
              nullable: true
              description: 소개(최대 5000자). 없으면 null
            copies:
              type: array
              minItems: 1
              description: 권별 상태. copyNo 오름차순. 도서는 권이 최소 1개이다. availableCount ≤ copies 의 개수이고 0 이면 모두 대여 중이다.
              items:
                $ref: "#/components/schemas/BookCopy"
            hasOverdue:
              type: boolean
              description: 요청한 임직원 본인에게 연체 중인 열린 대여 건이 있으면 true. 「대여」 비활성 사유를 화면을 연 시점부터 보이는 데 쓴다.
    BorrowRequest:
      type: object
      required: [requestId]
      additionalProperties: false
      properties:
        requestId:
          type: string
          format: uuid
          description: 화면이 「대여」를 누를 때 만든 요청 식별자. 응답을 못 받았으면 같은 값으로 다시 보내고, 응답을 받으면 다음 누름에서 새 값을 만든다.
    BorrowResult:
      type: object
      required: [loanId, bookTitle, dueOn, replayed]
      additionalProperties: false
      properties:
        loanId:
          type: string
          format: uuid
        bookTitle:
          type: string
          maxLength: 300
        dueOn:
          type: string
          format: date
          description: 반납 예정일(한국 표준시 달력 날짜 YYYY-MM-DD). 대여일 + 14일.
        replayed:
          type: boolean
          description: 같은 requestId 의 재전송에 첫 결과를 돌려준 것이면 true
    MyLoansItem:
      type: object
      required: [loanId, bookTitle, dueOn, overdue]
      additionalProperties: false
      properties:
        loanId:
          type: string
          format: uuid
        bookTitle:
          type: string
          maxLength: 300
        dueOn:
          type: string
          format: date
          description: 반납 예정일(한국 표준시 달력 날짜 YYYY-MM-DD)
        overdue:
          type: boolean
          description: 반납 예정일이 오늘(한국 표준시)보다 앞서면 true. 예정일 당일은 false.
    MyLoansResult:
      type: object
      required: [items, hasOverdue]
      additionalProperties: false
      properties:
        items:
          type: array
          description: 열린 대여 건. 반납 예정일 오름차순, 같으면 먼저 빌린 순.
          items:
            $ref: "#/components/schemas/MyLoansItem"
        hasOverdue:
          type: boolean
          description: items 중 연체가 하나라도 있으면 true
    ReturnResult:
      type: object
      required: [loanId, returnedOn]
      additionalProperties: false
      properties:
        loanId:
          type: string
          format: uuid
        returnedOn:
          type: string
          format: date
          description: 반납일(한국 표준시 달력 날짜 YYYY-MM-DD)
    HealthStatus:
      type: object
      required: [status]
      additionalProperties: false
      properties:
        status:
          type: string
          enum: [ok]
