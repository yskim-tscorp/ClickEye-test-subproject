  /api/books/{bookId}/cover:
    get:
      operationId: getBookCover
      tags: [도서]
      summary: 도서 표지 이미지를 가져온다
      description: >-
        검색 결과 줄(SCR-02)과 도서 상세(SCR-03)가 표지를 그릴 때, 목록·상세의 hasCover 가 true 인 도서에 대해서만 부른다.
        세션이 필요하다. CSRF 토큰은 필요 없다. 응답은 png·jpeg·webp 파일이며 확장자로 형식을 정한다.
        표지 파일이 없거나 표지 이름이 비어 있으면(tech-spec 의 openCover 가 null) 이미지 대신 404 BOOK_NOT_FOUND 를 돌려준다.
        화면은 hasCover 가 false 인 도서에는 이 요청을 보내지 않고 회색 자리 상자를 보이며, 이 요청이 404 를 받아도 같은 회색 상자를 보인다(SCR-06 으로 이동하지 않는다).
        표지가 브라우저에서 직접 열려도 스크립트가 돌지 않도록 보안 머리말을 붙인다.
        bookId 형식 오류는 getBook 과 같이 404 BOOK_NOT_FOUND 이다.
      x-screens: [SCR-02, SCR-03]
      parameters:
        - $ref: "#/components/parameters/BookId"
      responses:
        "200":
          description: 표지 이미지 파일
          headers:
            Cache-Control:
              description: >-
                표지는 사용자별 세션이 필요하므로 공유 캐시를 쓰지 않고 브라우저에만 하루 둔다.
                표지는 민감하지 않은 정보라서 /api 응답 중 이 200 만 no-store 대신 이 값을 허용한다.
              schema:
                type: string
                enum: ["private, max-age=86400"]
            X-Content-Type-Options:
              schema:
                type: string
                enum: ["nosniff"]
            Content-Disposition:
              schema:
                type: string
                enum: ["inline"]
            Content-Security-Policy:
              description: 표지 파일이 직접 열려도 스크립트가 돌지 않게 한다.
              schema:
                type: string
                enum: ["sandbox"]
          content:
            image/png:
              schema:
                type: string
                format: binary
            image/jpeg:
              schema:
                type: string
                format: binary
            image/webp:
              schema:
                type: string
                format: binary
        "401":
          $ref: "#/components/responses/SessionExpired"
        "404":
          description: >-
            BOOK_NOT_FOUND. 원인은 도서가 없거나 bookId 형식이 틀렸거나, 그 도서에 표지 파일이 없는 것이다.
            사용자가 할 일은 없다. 화면은 이 응답을 받으면 표지 자리에 회색 상자를 그대로 보인다.
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControlNoStore"
            X-Request-Id:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                noCover:
                  summary: 표지가 없는 도서
                  value:
                    code: BOOK_NOT_FOUND
                    message: "도서를 찾을 수 없습니다"
                    details: []
                    trace_id: "4f1c2a9e0b7d4e6f8a3b5c7d9e1f2a3b"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          description: >-
            UNAVAILABLE. 원인은 저장소 오류·표지 파일 읽기 실패이다. 화면은 회색 자리 상자를 보이고 사용자가 할 일은 없다(화면을 새로 고치면 다시 시도한다).
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControlNoStore"
            X-Request-Id:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                unavailable:
                  value:
                    code: UNAVAILABLE
                    message: "처리하지 못했습니다. 다시 시도해 주세요. 계속되면 IT 지원(내선 <IT 지원 내선>)에 문의하세요"
                    details: []
                    trace_id: "4f1c2a9e0b7d4e6f8a3b5c7d9e1f2a3b"

  /api/books/{bookId}/loans:
    post:
      operationId: borrowBook
      tags: [대여와 반납]
      summary: 도서 한 권을 빌린다
      description: >-
        도서 상세 화면(SCR-03)에서 「대여」를 누를 때 부른다. 세션 쿠키와 X-CSRF-Token 머리말이 모두 필요하다.
        대여할 임직원은 세션이 가리키는 본인이다(본문에 임직원 id 를 보내지 않는다).
        서버가 대여 가능한 권 하나를 골라 즉시 대여하고 반납 예정일은 오늘(한국 표준시) + 14일이다. 연체 중이거나 대여 가능한 권이 없으면 거절하고 저장하지 않는다.
        requestId 는 화면이 「대여」를 누를 때 만든 UUID 이다. 같은 임직원이 같은 requestId 로 같은 도서를 다시 보내면(응답 유실 뒤 재시도)
        새로 만들지 않고 첫 결과를 replayed true 와 함께 200 으로 돌려준다. 새 대여는 201 이다.
        requestId 는 임직원별로 따진다. 다른 임직원이 쓴 값은 없는 것과 같다.
        같은 requestId 로 다른 도서를 요청하면 409 REQUEST_ID_CONFLICT 이다.
        예시는 기준일 2028-03-02(FixedClock 오늘)에 빌린 장면이라 반납 예정일이 2028-03-16 이고 loanId 는 L1 이다.
        본문에 requestId 외의 필드가 있으면 거부한다. bookId 형식 오류는 404 BOOK_NOT_FOUND 이다.
      x-screens: [SCR-03]
      parameters:
        - $ref: "#/components/parameters/BookId"
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BorrowRequest"
            examples:
              default:
                value:
                  requestId: "7c9e6679-7425-40de-944b-e07fc1f90ae7"
      responses:
        "200":
          description: 같은 requestId 의 재전송. 첫 번째 결과를 그대로 돌려준다(replayed true).
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControlNoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BorrowResult"
              examples:
                replayed:
                  value:
                    loanId: "3f2504e0-4f89-41d3-9a0c-0305e82c3301"
                    bookTitle: "시험 도서 A"
                    dueOn: "2028-03-16"
                    replayed: true
        "201":
          description: 새 대여가 생겼다(replayed false).
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControlNoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BorrowResult"
              examples:
                created:
                  value:
                    loanId: "3f2504e0-4f89-41d3-9a0c-0305e82c3301"
                    bookTitle: "시험 도서 A"
                    dueOn: "2028-03-16"
                    replayed: false
        "400":
          description: >-
            VALIDATION_FAILED. 원인은 requestId 가 없거나 UUID 가 아님, 본문에 알 수 없는 필드가 있음, 본문이 JSON 이 아님, 본문 한도 초과이다.
            본문 한도 초과(프록시 nginx 의 413 은 400 VALIDATION_FAILED 로 바꿔 답한다)도 같은 400 이다.
            본문이 JSON 으로 읽히지 않으면 details 는 [{"field":"(body)","rule":"type"}], 본문 한도 초과면 [{"field":"(body)","rule":"maxLength"}] 이다.
            화면이 정상이면 나지 않는다. 사용자는 화면을 새로 고쳐 다시 시도한다.
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControlNoStore"
            X-Request-Id:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                badRequestId:
                  value:
                    code: VALIDATION_FAILED
                    message: "입력한 내용을 확인해 주세요."
                    details:
                      - field: requestId
                        rule: format
                    trace_id: "4f1c2a9e0b7d4e6f8a3b5c7d9e1f2a3b"
        "401":
          $ref: "#/components/responses/SessionExpired"
        "403":
          $ref: "#/components/responses/CsrfRejected"
        "404":
          $ref: "#/components/responses/BookNotFound"
        "409":
          description: >-
            현재 상태와 충돌해 대여하지 않았다(저장하지 않음). 코드는 세 가지이다.
            OVERDUE_BLOCKED 는 본인에게 연체 중인 대여 건이 있는 것이고 사용자는 내 대여 현황에서 연체 도서를 반납한 뒤 다시 빌린다.
            NO_COPY_AVAILABLE 은 대여 가능한 권이 없는 것(마지막 권을 다른 사람이 먼저 빌린 경우 포함)이고 사용자는 다른 도서를 찾는다.
            REQUEST_ID_CONFLICT 는 같은 요청 식별자로 다른 도서를 요청한 것이고 사용자는 내 대여 현황에서 확인한 뒤 필요하면 다시 빌린다.
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControlNoStore"
            X-Request-Id:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                overdue:
                  value:
                    code: OVERDUE_BLOCKED
                    message: "연체 중인 도서가 있어 새로 빌릴 수 없습니다. 내 대여 현황에서 연체 도서를 반납한 뒤 다시 빌려 주세요."
                    details: []
                    trace_id: "4f1c2a9e0b7d4e6f8a3b5c7d9e1f2a3b"
                noCopy:
                  value:
                    code: NO_COPY_AVAILABLE
                    message: "방금 모든 권이 대여 중이 되었습니다. 도서 상세나 검색 화면으로 돌아가 다른 도서를 찾아 주세요."
                    details: []
                    trace_id: "4f1c2a9e0b7d4e6f8a3b5c7d9e1f2a3b"
                requestIdConflict:
                  value:
                    code: REQUEST_ID_CONFLICT
                    message: "대여가 되지 않았습니다. 내 대여 현황에서 확인한 뒤 필요하면 다시 빌려 주세요."
                    details: []
                    trace_id: "4f1c2a9e0b7d4e6f8a3b5c7d9e1f2a3b"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          description: >-
            UNAVAILABLE. 원인은 저장소 오류·시간 초과이며 트랜잭션은 전부 되돌려졌다. 응답이 끊겨 결과를 모를 수도 있으므로
            사용자는 내 대여 현황에서 확인한 뒤 필요하면 다시 빌린다(같은 requestId 로 다시 보내면 중복되지 않는다).
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControlNoStore"
            X-Request-Id:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                unavailable:
                  value:
                    code: UNAVAILABLE
                    message: "대여가 되지 않았거나 결과를 확인하지 못했습니다. 내 대여 현황에서 확인한 뒤 필요하면 다시 빌려 주세요."
                    details: []
                    trace_id: "4f1c2a9e0b7d4e6f8a3b5c7d9e1f2a3b"

  /api/employees/{employeeId}/loans:
    get:
      operationId: listEmployeeLoans
      tags: [대여와 반납]
      summary: 내 대여 현황(아직 반납하지 않은 대여 건)을 가져온다
      description: >-
        내 대여 현황 화면(SCR-04)이 열릴 때와 「다시 불러오기」「현황 다시 불러오기」를 누를 때 부른다. 세션이 필요하다. CSRF 토큰은 필요 없다.
        경로의 employeeId 가 세션의 임직원과 다르면 그 임직원이 있든 없든 똑같이 403 FORBIDDEN 으로 답해 존재 여부를 알리지 않는다.
        employeeId 가 UUID 형식이 아니어도 400 이 아니라 403 FORBIDDEN 이다. 세션 확인이 먼저다.
        열린 대여 건만 돌려주며 반납 예정일 오름차순, 같으면 먼저 빌린 순이다. overdue 는 반납 예정일이 오늘(한국 표준시)보다 앞선 건이고
        예정일 당일은 연체가 아니다. hasOverdue 는 items 중 연체가 하나라도 있는지이다.
      x-screens: [SCR-04, SCR-08]
      parameters:
        - $ref: "#/components/parameters/EmployeeId"
      responses:
        "200":
          description: 내 대여 현황
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControlNoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MyLoansResult"
              examples:
                default:
                  summary: 기준일 2028-03-02 에 연체 건(L2)과 예정일 당일 건(L3)이 있음
                  value:
                    items:
                      - loanId: "a1b2c3d4-e5f6-4a7b-8c9d-0e1f2a3b4c5d"
                        bookTitle: "시험 도서 A"
                        dueOn: "2028-03-01"
                        overdue: true
                      - loanId: "6ba7b810-9dad-41d1-80b4-00c04fd430c8"
                        bookTitle: "시험 도서 B"
                        dueOn: "2028-03-02"
                        overdue: false
                    hasOverdue: true
                empty:
                  summary: 빌린 도서가 없음
                  value:
                    items: []
                    hasOverdue: false
        "401":
          $ref: "#/components/responses/SessionExpired"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          description: >-
            UNAVAILABLE. 원인은 저장소 오류·시간 초과이다. 화면은 목록 자리에 안내와 「다시 불러오기」를 보이고 빈 목록 문구를 대신 보이지 않는다.
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControlNoStore"
            X-Request-Id:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                unavailable:
                  value:
                    code: UNAVAILABLE
                    message: "대여 현황을 불러오지 못했습니다. 다시 불러와 주세요."
                    details: []
                    trace_id: "4f1c2a9e0b7d4e6f8a3b5c7d9e1f2a3b"

